# /etc/systemd/system/mactelnet-proxy.service.d/vrf.conf
#
# Optional drop-in: run mactelnet-proxy inside a Linux VRF using
# `ip vrf exec`. Useful when the management interface lives in a
# dedicated routing table (e.g. `mgmt` on switch/router platforms
# like VyOS, FRR, Cumulus).
#
# Install:
#   sudo install -D -m 0644 \
#       /usr/share/doc/mactelnet-proxy/examples/vrf.conf \
#       /etc/systemd/system/mactelnet-proxy.service.d/vrf.conf
#   sudoedit /etc/systemd/system/mactelnet-proxy.service.d/vrf.conf   # set VRF=
#   sudo systemctl daemon-reload
#   sudo systemctl restart mactelnet-proxy
#
# `ip vrf exec` attaches an eBPF cgroup hook that binds sockets
# created by the child process to the named VRF's L3 master device.
# That setup needs CAP_NET_ADMIN + CAP_SYS_ADMIN (kernel < 5.8) or
# CAP_NET_ADMIN + CAP_BPF (>= 5.8). The grants below pick the
# portable SYS_ADMIN pair — swap CAP_SYS_ADMIN for CAP_BPF on hosts
# you know run a 5.8+ kernel if you want the tighter set.

[Service]
# Reset the inherited ExecStart, then re-emit it wrapped in `ip vrf exec`.
# The empty assignment is required by systemd to clear list-typed
# directives before appending.
ExecStart=
ExecStart=/usr/sbin/ip vrf exec ${VRF} /usr/bin/mactelnet-proxy serve

# Name of the VRF to enter. Set it here, or pin `VRF=...` in
# /etc/default/mactelnet-proxy alongside the MACTELNET_PROXY_* vars.
Environment=VRF=mgmt

# Expand the base unit's bounding set so root can hold the caps
# `ip vrf exec`'s bpf()/cgroup setup needs, on top of the proxy's
# own NET_RAW + NET_BIND_SERVICE.
CapabilityBoundingSet=CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_NET_ADMIN CAP_SYS_ADMIN

# The base unit's `SystemCallFilter=~@privileged` denylist blocks
# bpf(2) and mount(2), which `ip vrf exec` needs to attach the
# cgroup BPF program (and, on rare first-boot paths, mount cgroup2).
# Reset and re-allow @system-service + @privileged; keep @resources
# denied so the daemon still can't fiddle with rlimits / sched.
SystemCallFilter=
SystemCallFilter=@system-service @privileged
SystemCallFilter=~@resources

# `ip vrf exec` creates a sub-cgroup under the service's own cgroup
# (e.g. /sys/fs/cgroup/system.slice/mactelnet-proxy.service/vrf) and
# attaches its eBPF program there. The base unit's
# ProtectControlGroups=yes makes /sys/fs/cgroup read-only for the
# service and that mkdir fails with EROFS. Allow cgroup writes here
# so the VRF setup can complete.
ProtectControlGroups=no
